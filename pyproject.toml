[project]
name = "anomaly-guard"
version = "0.1.0"
description = "Local explainable HTTP request anomaly detector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "streamlit>=1.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[project.scripts]
anomaly-guard = "anomaly_guard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["anomaly_guard*"]

[tool.setuptools.package-data]
anomaly_guard = ["config/*.yaml", "publish_assets/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "app:main"
